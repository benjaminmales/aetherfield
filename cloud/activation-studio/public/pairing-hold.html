<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aetherfield — Device pairing</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 16px;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #94a3b8;
      }
      .params {
        font-size: 0.75rem;
        color: #64748b;
        word-break: break-all;
        margin-top: 20px;
        padding: 12px;
        background: #0f172a;
        border-radius: 8px;
        text-align: left;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pairing — coming soon</h1>
      <p>
        This link is reserved for the Aetherfield setup app. You scanned a placeholder QR from the
        Activation Studio; full registration and device linking will open here once the mobile app
        is available.
      </p>
      <p style="margin-bottom: 0">Thank you for testing the flow.</p>
      <div class="params" id="params"></div>
    </div>
    <script>
      var q = window.location.search || "(no query)";
      document.getElementById("params").textContent = "URL: " + window.location.href + "\n" + q;
    </script>
  </body>
</html>

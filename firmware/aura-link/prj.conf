# Aetherfield Pixel gateway — XIAO nRF54LM20A + W5500.
#
# Note what is NOT here: CONFIG_NET_L2_ETHERNET, CONFIG_NET_IPV4,
# CONFIG_NET_SOCKETS. The W5500 runs its own TCP stack in silicon and we drive
# it over SPI, so Zephyr's networking subsystem stays out of the image. That is
# what lets the 802.15.4 raw path keep owning net_recv_data() — turning on the
# IP stack would put Zephyr's Ethernet driver in the same symbol.

# --- 802.15.4 raw mode: unchanged from the working gateway firmware ---------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=48

# net_recv_data() — our frame handler — runs on this driver thread, and it
# formats and queues a telemetry line per frame. The stock 1024 bytes is sized
# for a driver that hands the packet straight up a stack, not for one that does
# work in place. Headroom here is cheap; a stack overflow on the first received
# frame is not.
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=2048

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- W5500 ------------------------------------------------------------------
CONFIG_SPI=y
CONFIG_GPIO=y
# MAC address is derived from the SoC's factory device ID.
CONFIG_HWINFO=y

# --- console / shell --------------------------------------------------------
# The shell is not a convenience here: link.c routes every inbound server
# command through shell_execute_cmd(), so the command table IS the network
# command surface. Disabling the shell disables downlink.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Required for downlink. link.c runs server commands on the dummy backend;
# without this, shell_execute_cmd() refuses every command with -EINVAL and the
# failure looks exactly like a malformed argument list.
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_VT100_COLORS=n
# Async telemetry from the radio thread interleaves with the shell prompt, and
# the shell redraws it with VT100 cursor moves that land mid-line and break any
# parser reading it.
CONFIG_SHELL_VT100_COMMANDS=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# RF switch power/control are regulator-fixed nodes with regulator-boot-on;
# without this the RF switch IC is never powered and there is NO antenna path.
CONFIG_REGULATOR=y

# --- persistent network config (src/link_cfg.c) -----------------------------
# Set over USB with `link set ...` / `link save`, kept across reboots. ZMS is
# the store Nordic recommends for the nRF54's RRAM. The partition manager
# carves a settings_storage partition out automatically.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_REBOOT=y

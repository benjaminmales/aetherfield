# Aura Tag on the stock HOLYIOT-25008. Same radio configuration as the Pixel
# build on this module, plus nothing: the button is plain GPIO.

# --- radio ------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=120

# --- identity ---------------------------------------------------------------
# FICR-derived short address: fine for a demo handful. Fleets get assigned
# addresses at flash time — see docs/PROTOCOL.md §3.2.
CONFIG_HWINFO=y

# --- LED --------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_PWM=y
# The module's button is deliberately unused: Aura products have no button.
CONFIG_INPUT=n

# --- motion: LIS2DH12 any-motion interrupt (INT1, P2.00) --------------------
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
# High-pass the any-motion interrupt path. Without it INT1 compares RAW
# acceleration with the threshold, and gravity (1 g) alone exceeds it: a Tag
# lying still on a table would report "moving" forever.
CONFIG_LIS2DH_ACCEL_HP_FILTERS=y

# --- battery: SAADC reads the SoC's own VDD (= the coin cell) ---------------
CONFIG_ADC=y

# --- console over RTT -------------------------------------------------------
# No USB bridge on this module. RTT rides the SWD probe and cannot stall boot
# on a coin cell the way a UART console can.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

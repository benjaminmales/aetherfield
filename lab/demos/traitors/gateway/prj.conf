
# Minimal 802.15.4 configuration
CONFIG_NETWORKING=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_MAIN_STACK_SIZE=1024

# Increase nRF 802.15.4 receive buffers to prevent exhaustion
# Maximum is limited by notification pool bit width - try 32 or 48
CONFIG_NRF_802154_RX_BUFFERS=48

# Enable heap for dynamic memory allocation (needed for work queue packet processing)
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable Zephyr shell and UART backend
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n

# GPIO support for antenna switching
CONFIG_GPIO=y
CONFIG_LOG=y
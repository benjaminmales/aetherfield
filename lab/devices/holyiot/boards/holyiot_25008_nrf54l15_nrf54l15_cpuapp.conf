# Board-specific overrides for the Holyiot 25008 module.
# Applied automatically on top of prj.conf when building for
# holyiot_25008_nrf54l15/nrf54l15/cpuapp.

# IMU is LIS2DH12 over SPI, not LSM6DSO over I2C
CONFIG_I2C=n
CONFIG_LSM6DSO=n
CONFIG_LSM6DSO_TRIGGER_GLOBAL_THREAD=n
CONFIG_SPI=y
CONFIG_LIS2DH=y

# RGB LED is on GPIOs (PWM), no LP5012, no DK library
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_DK_LIBRARY=n

# No PDM microphone on this board
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n

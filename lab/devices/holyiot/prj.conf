# Enabling radio driver
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# Increase the number of RX buffers to minimize the chances of frame drops.
# The value must not be higher than 127 - X, where X is the number of notification
# slots reserved by the radio driver (see NTF_PRIMARY_POOL_SIZE macro definition).
CONFIG_NRF_802154_RX_BUFFERS=120

# UART shell/console disabled for battery operation (blocks boot on battery)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_STDOUT_CONSOLE=n

# LED indication
CONFIG_DK_LIBRARY=y

# Logging disabled for battery operation
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_CBPRINTF_FP_SUPPORT=y
# CONFIG_CBPRINTF_COMPLETE=y

# I2C / Sensors (IMU)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_GLOBAL_THREAD=y

# DMIC (microphone)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# USB device stack not used
CONFIG_USB_DEVICE_STACK=n

# Disable boot banner
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Enable hardware FPU (required for nrf_edgeai library)
CONFIG_FPU=y

# Regulator driver for VBAT power (battery operation)
CONFIG_REGULATOR=y

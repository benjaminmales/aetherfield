# ============================================================================
# K7 Beacon — bring-up / debug overlay (layer on top of prj.conf)
#
#   make build DEBUG=1     # or: west build ... -- -DEXTRA_CONF_FILE=debug.conf
#
# Re-enables console + log output over SEGGER RTT (same J-Link, no UART wiring).
# Do NOT ship with this: RTT logging keeps the CPU busy and raises idle current.
# ============================================================================

CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

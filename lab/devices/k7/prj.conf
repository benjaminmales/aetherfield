# ============================================================================
# K7 Beacon (nRF54L15) — production (low-power) configuration
#
# Default state is System OFF (~0.8 uA); the KEY button wakes a short active
# session. Logging/console are OFF here to save power — build with debug.conf
# layered on top for bring-up (see Makefile `make build DEBUG=1`).
# ============================================================================

# --- 802.15.4 radio (raw mode), Aetherfield protocol v1 ---
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
# We only receive during short active windows, so a small RX pool is plenty.
CONFIG_NRF_802154_RX_BUFFERS=16

# --- RGB LED on PWM (indication only) + button GPIO ---
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_GPIO=y

# --- Deep sleep: System OFF via sys_poweroff(), button wake ---
CONFIG_POWEROFF=y

# --- Console / logging OFF for production power ---
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# --- Power: DCDC regulator ---
CONFIG_REGULATOR=y

# --- Peripherals the K7 does NOT have / does not use ---
CONFIG_DK_LIBRARY=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
CONFIG_INPUT=n

# ============================================================================
# K4 hello world -- pulse one LED.
#
#     Extra Kconfig fragments: breathe.conf
#     (add breathe-d2.conf as well to pulse the other LED)
#
# What you should see, in order:
#
#     1 flash   D1  (P1.04)      <- watch which face this is on
#     2 flashes D2  (P2.03)
#     then a continuous ~3 s breathe on D1
#
# D1 is assumed to be the TOP LED, by elimination: D2/P2.03 is the one that lit
# during the pin probe while the bottom face was being watched. The schematic
# names nets, not faces, so the flash count above is what actually settles it.
# If D1 turns out to be the bottom one, add breathe-d2.conf.
#
# Radio off -- this is a pure LED test. The default (no fragment) build keeps
# the radio and drives both LEDs from the gateway instead.
# ============================================================================

CONFIG_K4_APP_BREATHE=y
CONFIG_PWM=y

CONFIG_NETWORKING=n
CONFIG_IEEE802154=n

# ============================================================================
# K4 -- low-power fragment. Layer on top of prj.conf for battery operation.
#
# Strips the UART console and logging. Keep it as a SEPARATE build
# configuration rather than editing prj.conf: losing the console is what makes
# a misbehaving board undiagnosable, and bring-up should stay one click away.
# ============================================================================

CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

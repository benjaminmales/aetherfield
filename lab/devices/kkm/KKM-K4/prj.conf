# ============================================================================
# K4 Beacon (nRF54L15) -- Aetherfield v2 band (default application)
#
# Joins the fleet using the shared AURA/common/aura_band.c and paints the
# commanded colour onto the two red LEDs.
#
# Matched deliberately to AURA/pixel-xiao-nRF54 and AURA/seeedFirmware, which
# are WORKING BANDS on this silicon running the identical aura_band.c.
# ============================================================================

# --- 802.15.4 raw mode: the driver hands full PSDUs to the band layer's
#     net_recv_data() override, same mechanism as the gateway. ---
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=120

# --- The FICR device id becomes the 16-bit short address: no provisioning ---
CONFIG_HWINFO=y

# --- The two red LEDs, D1 on P1.04 and D2 on P2.03 (PWM20 OUT0 / OUT1) ---
CONFIG_PWM=y
CONFIG_GPIO=y

# --- main() stack ---
#
# NOT a tuning knob. main() runs the whole of aura_band_init(); MPSL and the
# 802.15.4 stack come up underneath it. The Seeed board defconfig supplies
# 3584 for exactly this reason -- our K4 board defconfig does not, so it must
# be stated here or Zephyr's much smaller default applies.
#
# The failure mode is not a clean stack-overflow fault: it scribbles into low
# RAM, which is where .data lives (_sw_isr_table, the net_buf pools). Both were
# seen corrupted on the pixel module. Do not lower this.
CONFIG_MAIN_STACK_SIZE=3584

# --- LF clock: internal RC ---
# The 32.768 kHz crystal IS fitted (X1, 7 pF), but the correct
# load-capacitance-femtofarad is unsettled -- see the note in the board .dts.
# Calibrated RC is ~250 ppm and fine for beaconing. Switch with
# lfxo.conf + overlays/lfxo.overlay when SYNC accuracy matters.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Console on UART30, P0.00 / P0.01 test points ---
#
# This board's first real console. The gateway is still the more convenient
# one (no wiring), but a serial line sees boot failures the radio never
# reaches. Strip both with lowpower.conf for battery operation.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# --- Power: DCDC (L3 4.7 uH is populated -- see the board .dts) ---
CONFIG_REGULATOR=y

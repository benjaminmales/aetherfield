# ============================================================================
# K4 -- radio-narrated GPIO pin probe.
#
#     Extra Kconfig fragments: probe.conf
#
# Largely of historical interest now that the schematic has landed: the LEDs
# are D1 = P1.04 and D2 = P2.03, both active high. Kept because it is the tool
# that found them, and because it is the right first move on the next unknown
# board.
# ============================================================================

CONFIG_K4_APP_PINPROBE=y

# P1.02 / P1.03 are NFC1 / NFC2 and refuse gpio_pin_configure while NFCT owns
# them. The schematic shows nothing attached to either, so this is no longer
# needed to find anything -- left on so the probe reports honestly rather than
# logging two s=3 refusals.
#
# UICR is written at boot and takes effect after a RESET: power-cycle once
# after flashing. Reversible with a mass-erase.
CONFIG_NFCT_PINS_AS_GPIOS=y

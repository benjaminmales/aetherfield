# ============================================================================
# K4 -- GPIO pin sweep instead of the beacon.
#
#     Extra Kconfig fragments  : sweep.conf
#     Extra devicetree overlays: overlays/sweep.overlay
#
# The overlay disables pwm20 so the sweep can drive P1.10 as a plain GPIO.
# ============================================================================

CONFIG_K4_APP_SWEEP=y

# The sweep does not use the radio; dropping it keeps the image small and
# removes MPSL from the boot path, so a sweep that stays dark is a shorter
# list of suspects.
CONFIG_NETWORKING=n
CONFIG_IEEE802154=n

# pixel-led-test — minimal bring-up for the HB blue LED modification.
# Deliberately tiny: no radio, no sensors, no Edge AI. If this does not
# light the LED, the problem is the hardware or the overlay, nothing else.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Console over RTT. SWD is already connected for flashing, so this needs no
# extra wires — unlike UART, which would mean soldering to the TXD/RXD pads.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="pixel:~$ "

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

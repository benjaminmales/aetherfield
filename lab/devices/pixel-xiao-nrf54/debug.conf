# Bench profile: console only. Nothing else.
#
# VS Code -> Add Build Configuration -> Extra Kconfig fragments: debug.conf
#
# prj.conf ships with serial and logging off: a UART console backend blocks
# boot when the board runs from its battery with no USB attached. Do NOT
# flash a debug build for a battery demo.
#
# Console is uart20 -> onboard SAMD11 -> USB-C. CoolTerm 115200 8N1.
#
# WHY THERE IS NOTHING ELSE IN HERE
#
# CONFIG_ASSERT=y used to be in this file and it made the board completely
# dead - no boot blink, no console, on a stage that blinked fine without it.
# Asserts turn a driver init failure that was previously logged and ignored
# into a halt, and that halt can happen before the console exists, so you
# lose the blink AND the message that would explain it. A debug profile that
# makes the board less diagnosable is worse than no debug profile.
#
# Add things back ONE at a time, and only once plain console output works.

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

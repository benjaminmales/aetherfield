# Bisect fragment: strip the radio out entirely.
#
# VS Code -> Add Build Configuration -> Extra Kconfig fragments: noradio.conf
# Also set AURA_BAND_STAGE to 1 at the top of src/main.c.
#
# Nothing else. CMakeLists.txt keys the band layer off CONFIG_IEEE802154, so
# turning the radio off here drops aura_band.c from the build automatically.
#
# Together those give a build with no 802.15.4 stack, no aura_band.c linked,
# and no reference to either from main() - just the WS2812 blink. If THAT
# faults, the problem is the board or the base configuration, and nothing
# in the Aetherfield firmware is implicated.

CONFIG_NETWORKING=n
CONFIG_IEEE802154=n
CONFIG_IEEE802154_RAW_MODE=n
CONFIG_NET_PKT_TIMESTAMP=n
CONFIG_HWINFO=n

# --- NeoPixel (WS2812) on D4 via SPIM22 ---
CONFIG_SPI=y
CONFIG_LED_STRIP=y
# Selected automatically from the DT compat; listed here for clarity.
CONFIG_WS2812_STRIP_SPI=y

# The nrfx SPIM driver bounces a transfer through a RAM buffer when it judges
# the source not to be DMA-accessible; the default is 8 bytes, which would
# chunk our 24-byte pixel buffer into three transfers. Make it big enough to
# take the whole thing in one go.
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=32

# --- 802.15.4 raw mode: the driver hands full PSDUs to the shared band
#     layer's net_recv_data() override, same mechanism as the gateway. ---
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
# Matched to AURA/seeedFirmware, which is a WORKING BAND on this silicon
# running the identical aura_band.c. Diverging from it was not worth the few
# KB it saved.
#
# CONFIG_MAIN_STACK_SIZE is deliberately ABSENT. The Seeed board defconfig
# sets 3584; the original hello-world prj.conf here overrode it down to 2048
# and that override survived into the radio firmware. main() runs the whole
# of aura_band_init() - MPSL and the 802.15.4 stack come up underneath it -
# and a main-stack overflow scribbles into low RAM, which is exactly where
# .data lives: _sw_isr_table at 0x2000031c and the net_buf pools at
# 0x20000d20. Both were seen corrupted. Let the board default stand.
CONFIG_NRF_802154_RX_BUFFERS=120

# The FICR device id becomes our 16-bit short address - no provisioning step.
CONFIG_HWINFO=y

# --- Console OFF for battery operation ---
#
# A UART console/shell backend waits on the port and blocks boot when the
# module runs from its cell with no USB attached - the band comes up dark and
# silent and looks dead. Same reason AURA/seeedFirmware ships this way.
#
# The cost is no visibility at all, so the boot blink in main() is the
# diagnostic instead: two white flashes = powered and running.
#
# For bring-up, build with -DEXTRA_CONF_FILE=debug.conf (see debug.conf).
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_USB_DEVICE_STACK=n
CONFIG_GPIO=y

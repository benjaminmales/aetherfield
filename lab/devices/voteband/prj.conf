# ---- Radio: raw IEEE 802.15.4 TX ----
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y

# Plenty of RX buffers isn't needed for a TX-only beacon; keep the default.

# ---- Inputs ----
CONFIG_GPIO=y          # vote button + onboard LED

# ---- Power / size: no console or shell on battery ----
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_LOG=n

# Drop boot banners
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Main loop sleeps most of the time
CONFIG_PM=n

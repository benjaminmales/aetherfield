# ============================================================================
# Xiao-nRF52840 - minimal 802.15.4 bring-up test (bare board: no accel/mic)
# ============================================================================

# ---- Radio: 802.15.4 raw mode (Aetherfield protocol v1) ----
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# ---- GPIO: onboard red/green/blue LEDs (led0/led1/led2) ----
CONFIG_GPIO=y

# ---- Console for bring-up visibility (leave on until this is proven out) ----
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# ---- No peripherals this board lacks ----
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
CONFIG_USB_DEVICE_STACK=n

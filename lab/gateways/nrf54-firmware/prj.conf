# 802.15.4 raw mode (same RX mechanism as the band firmware:
# driver hands full PSDUs to our net_recv_data override)
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_MAIN_STACK_SIZE=2048

# Increase nRF 802.15.4 receive buffers to prevent exhaustion
CONFIG_NRF_802154_RX_BUFFERS=48

# Heap for dynamic allocation
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Zephyr shell + console on UART (uart21 → Pi via the board overlay). This is the
# known-good config: streams NODE: telemetry with USB power. (Headless/standalone
# boot is parked — moving to a production module without the USB-CDC DTR block.)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
# Async telemetry (printk from the radio thread) interleaves with the shell
# prompt, and the shell redraws it with VT100 cursor moves - which arrive as
# \x1b[8D\x1b[J in the middle of a '<BCN ...' line and break any parser
# reading it. Harmless to a human in CoolTerm, fatal to the test bridge.
CONFIG_SHELL_VT100_COMMANDS=n

# GPIO support for antenna switching
CONFIG_GPIO=y
CONFIG_LOG=y
# Non-blocking logging so a busy/absent console can never stall boot.
CONFIG_LOG_MODE_DEFERRED=y

# RF switch power/control are regulator-fixed nodes with regulator-boot-on;
# without this the RF switch IC is never powered and there is NO antenna path.
CONFIG_REGULATOR=y

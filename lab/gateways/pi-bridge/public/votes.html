<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetherfield — Live Votes</title>
<style>
  :root {
    --bg1: #060a24; --bg2: #101a4d;
    --a: #c62828; --b: #1565c0; --c: #f9a825; --d: #2e7d32;
    --text: #e8ecff; --dim: #8b93c4;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% -20%, var(--bg2), var(--bg1) 70%);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 22px; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .totals { display: flex; gap: 24px; margin: 18px 0 6px; font-size: 14px; color: var(--dim); }
  .totals b { color: var(--text); font-size: 18px; }
  #grid {
    width: min(920px, 100%); display: grid; gap: 16px;
    grid-template-columns: 1fr 1fr; margin-top: 18px;
  }
  @media (max-width: 640px) { #grid { grid-template-columns: 1fr; } }
  .opt {
    position: relative; overflow: hidden;
    border: 2px solid rgba(255,255,255,.12); border-radius: 999px;
    padding: 18px 26px; background: rgba(255,255,255,.03);
    display: flex; align-items: center; gap: 16px; min-height: 84px;
    transition: border-color .2s;
  }
  .opt.leader { border-color: rgba(255,255,255,.85); }
  .letter {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff;
  }
  .bar {
    position: absolute; inset: 0; z-index: 0; opacity: .28;
    transform-origin: left; transform: scaleX(0);
    transition: transform .35s ease;
  }
  .meta { z-index: 1; display: flex; flex-direction: column; }
  .count { font-size: 30px; font-weight: 700; line-height: 1; }
  .pct { color: var(--dim); font-size: 13px; margin-top: 4px; }
  #bands {
    width: min(920px, 100%); margin-top: 26px; display: flex;
    flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .chip {
    font-family: ui-monospace, monospace; font-size: 12px;
    padding: 5px 10px; border-radius: 6px; color: #fff; opacity: .9;
  }
  .controls { margin-top: 28px; display: flex; gap: 12px; align-items: center; }
  button {
    background: transparent; color: var(--text); cursor: pointer;
    border: 1px solid rgba(255,255,255,.3); border-radius: 8px;
    padding: 8px 18px; font-size: 14px;
  }
  button:hover { border-color: #fff; }
  #status { font-size: 12px; color: var(--dim); }
  #status.live::before { content: "● "; color: #4caf50; }
  #status.down::before { content: "● "; color: #c62828; }
</style>
</head>
<body>
  <h1>Aetherfield &mdash; Live Votes</h1>
  <div class="sub">voteband-c6 → 802.15.4 → gateway → pi-bridge</div>

  <div class="totals">
    <span>Voters <b id="total">0</b></span>
    <span>Events <b id="events">0</b></span>
  </div>

  <div id="grid"></div>
  <div id="bands"></div>

  <div class="controls">
    <button id="reset">New round</button>
    <span id="status">connecting…</span>
  </div>

<script>
  const COLORS = { 1: "var(--a)", 2: "var(--b)", 3: "var(--c)", 4: "var(--d)" };
  const LETTERS = { 1: "A", 2: "B", 3: "C", 4: "D" };
  const grid = document.getElementById("grid");

  for (let i = 1; i <= 4; i++) {
    const el = document.createElement("div");
    el.className = "opt";
    el.id = "opt" + i;
    el.innerHTML = `
      <div class="bar" style="background:${COLORS[i]}"></div>
      <div class="letter" style="background:${COLORS[i]}">${LETTERS[i]}</div>
      <div class="meta">
        <div class="count">0</div>
        <div class="pct">0%</div>
      </div>`;
    grid.appendChild(el);
  }

  function render(s) {
    const total = Math.max(1, s.total);
    let max = 0;
    for (let i = 1; i <= 4; i++) max = Math.max(max, s.counts[i] || 0);
    for (let i = 1; i <= 4; i++) {
      const n = s.counts[i] || 0;
      const el = document.getElementById("opt" + i);
      el.querySelector(".count").textContent = n;
      el.querySelector(".pct").textContent = Math.round((n / total) * 100) + "%";
      el.querySelector(".bar").style.transform = "scaleX(" + n / total + ")";
      el.classList.toggle("leader", n > 0 && n === max);
    }
    document.getElementById("total").textContent = s.total;
    document.getElementById("events").textContent = s.eventCount;

    const bands = document.getElementById("bands");
    bands.innerHTML = "";
    for (const b of s.bands.slice(0, 40)) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.background = COLORS[b.choice];
      chip.textContent = `${b.band} → ${LETTERS[b.choice]}`;
      chip.title = `${b.via} @ ${b.at}`;
      bands.appendChild(chip);
    }
  }

  const status = document.getElementById("status");
  let pollTimer = null;

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      try {
        const r = await fetch("/api/votes");
        render(await r.json());
        status.textContent = "polling";
        status.className = "live";
      } catch {
        status.textContent = "gateway unreachable";
        status.className = "down";
      }
    }, 1000);
  }

  function connectSse() {
    const es = new EventSource("/api/votes/stream");
    es.onmessage = (e) => {
      render(JSON.parse(e.data));
      status.textContent = "live";
      status.className = "live";
    };
    es.onerror = () => {
      es.close();
      status.textContent = "reconnecting…";
      status.className = "down";
      startPolling();
      setTimeout(() => { clearInterval(pollTimer); pollTimer = null; connectSse(); }, 5000);
    };
  }

  document.getElementById("reset").onclick = async () => {
    const r = await fetch("/api/votes/reset", { method: "POST" });
    render(await r.json());
  };

  fetch("/api/votes").then(r => r.json()).then(render).catch(() => {});
  connectSse();
</script>
</body>
</html>

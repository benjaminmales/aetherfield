# Aetherfield gateway factory test — XIAO nRF54LM20A + W5500.
#
# Same build shape as the production gateway: raw 802.15.4, no Zephyr IP
# stack (the W5500 runs TCP/IP in silicon and is driven over SPI).

# --- 802.15.4 raw mode ------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=16

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- W5500 ------------------------------------------------------------------
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_HWINFO=y

# --- console / shell (USB-C, via the onboard SAMD11) ------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_PROMPT_UART="test> "

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# The board's nPM1300 PMIC provides the 3V3 rail; keep regulators enabled.
CONFIG_REGULATOR=y

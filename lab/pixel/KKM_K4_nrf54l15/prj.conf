# Pixel on the KKM K4 Beacon (nRF54L15).
#
# Deliberately small. A Pixel is one light and no sensors: the K4's LIS2DW12
# accelerometer, NFC and FRAM are all present on the board and none of them is
# used here.

# --- radio ------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=120

# --- identity ---------------------------------------------------------------
# FICR-derived short address: fine for dev boards, NOT production. See
# docs/PROTOCOL.md section 3.2.
CONFIG_HWINFO=y

# --- LEDs -------------------------------------------------------------------
# LED1 (P1.04) is LP-domain so pwm20 dims it. LED2 (P2.03) is MCU-domain,
# which LP-domain PWM cannot reach, so it is on/off via GPIO.
CONFIG_GPIO=y
CONFIG_PWM=y

# --- console ----------------------------------------------------------------
# uart30 on P0.01/P0.00 — the "30" instance, because those pins are in the
# low-power domain and uart20 cannot reach them.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

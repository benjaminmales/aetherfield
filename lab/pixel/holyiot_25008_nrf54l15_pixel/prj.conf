# Pixel on the modified HOLYIOT-25008.
#
# Deliberately small. A Pixel is one light and no sensors: no Edge AI, no
# microphone, no IMU, no sensor subsystem. See README.

# --- radio ------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_802154_RX_BUFFERS=120

# --- identity ---------------------------------------------------------------
# FICR-derived short address: fine for dev boards, NOT how production works.
# 5,000 units get sequential addresses at flash time. See docs/PROTOCOL.md §3.2.
CONFIG_HWINFO=y

# --- LEDs -------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_PWM=y

# --- console over RTT -------------------------------------------------------
# No USB bridge on this module, so the console rides the SWD you already have
# connected for flashing. Crucially this cannot stall boot on battery the way a
# UART console can, so it is safe to leave enabled on a coin cell.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

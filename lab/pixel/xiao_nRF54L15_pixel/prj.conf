# Pixel on Seeed XIAO nRF54L15.
#
# Deliberately small. A Pixel is one light and no sensors, so there is no
# Edge AI, no microphone, no IMU and no sensor subsystem here — see README.

# --- radio: raw 802.15.4, same as every other Aetherfield device ------------
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
# Must stay <= 127 minus the driver's notification slots.
CONFIG_NRF_802154_RX_BUFFERS=120

# --- identity ---------------------------------------------------------------
# The FICR device id becomes the 16-bit short address, so a dev board needs no
# provisioning step. NOT how production works: 5,000 units get sequential
# addresses at flash time, because FICR derivation collides. See docs/PROTOCOL.md.
CONFIG_HWINFO=y

# --- LEDs -------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y          # LP5012 RGB driver
CONFIG_REGULATOR=y    # antenna select + VBAT rail are regulator-fixed nodes

# --- console ----------------------------------------------------------------
# Console stays ON here, unlike the old band firmware. uart20 goes to the
# onboard SAMD11, which bridges to USB-C — there is no DTR line to stall boot
# on, so this is safe on battery. Build with -DEXTRA_CONF_FILE=silent.conf to
# strip it for a power measurement.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_USB_DEVICE_STACK=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Aetherfield load generator — nRF54L15 TAG.
#
# Deliberately the same radio configuration as firmware/pixels/*: raw
# 802.15.4, same PAN, same channel, same frame builder from aura_radio.h. A
# gateway cannot tell one of these frames from a real Pixel's, which is the
# only way the measurement means anything.

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# We transmit far more than we receive, but the CMD downlink still has to land
# — that is how each virtual device gets the cmd_seq it echoes, and therefore
# how the server measures downlink delivery.
CONFIG_NRF_802154_RX_BUFFERS=32

# aura_band derives this board's own address from the factory device id.
CONFIG_HWINFO=y
CONFIG_GPIO=y

# The TAG's RGB LED is plain GPIO, so no PWM is needed. aura_band's animation
# engine still runs in full; render() just thresholds each channel.

# --- console: RTT, because this board has none -------------------------------
#
# The nRF54L15 TAG defines no UART and no zephyr,console in its devicetree —
# its whole defconfig is CONFIG_GPIO and CONFIG_ARM_MPU. It is a tag, not a
# development kit, and there is nowhere to plug a serial cable.
#
# Asking for SHELL_BACKEND_SERIAL here fails in a thoroughly confusing way:
# Kconfig quietly drops UART_CONSOLE ("unsatisfied dependencies:
# SERIAL_HAS_DRIVER (=n)") and then shell_uart.c fails to compile on an
# undeclared __device_dts_ord_DT_CHOSEN_zephyr_shell_uart_ORD. Hundreds of
# lines of C error whose actual cause is one warning near the top of the log.
#
# RTT runs over the SWD connection you already flash through, so it costs no
# wiring at all. Read it with the nRF Connect RTT terminal or JLinkRTTViewer.
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_VT100_COLORS=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# NOT the RTT log backend.
#
# The shell already owns RTT channel 0, and the RTT log backend defaults to
# channel 0 as well — Zephyr catches that with a BUILD_ASSERT reading
# "Conflicting log RTT backend enabled on the same channel", which is accurate
# but well hidden inside shell_rtt.c.
#
# Two ways out: move the log to channel 1, or let the shell carry it. The
# shell's own log backend is on by default and puts log lines in the same
# window as the command output, which is what you want when you are typing
# 'sim stats' and watching for a warning. One channel, one window.
CONFIG_LOG_BACKEND_RTT=n

# Shell and log share one RTT up-buffer, so give it room. The default 1024 is
# enough to lose a burst of log lines at boot.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_BOOT_BANNER=n

# 500 virtual devices x 2 bytes of state is nothing; the stack headroom is for
# the transmit path running from a timer-driven work item.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
# The load generator has its own thread now (see src/main.c), so the system
# workqueue is back to carrying only what Zephyr puts on it.
